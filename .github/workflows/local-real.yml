name: Local real scanner

on:
  pull_request:
    paths:
      - "backend/**"
      - "lab/**"
      - "ops/local_real_ci.py"
      - "docker-compose.yml"
      - "docker-compose.local-real.yml"
      - ".github/workflows/local-real.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perimeter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated lab
        run: docker compose --project-name spectrascope-lab -f lab/docker-compose.yml up -d --build
      - name: Start scanner-enabled backend
        run: docker compose --project-name spectrascope -f docker-compose.yml -f docker-compose.local-real.yml up -d --build postgres redis backend worker
      - name: Verify the full local-real API flow
        run: python3 ops/local_real_ci.py
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-real-results
          path: artifacts/local-real-results.json
          if-no-files-found: error
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose --project-name spectrascope -f docker-compose.yml -f docker-compose.local-real.yml logs --no-color backend worker
          docker compose --project-name spectrascope-lab -f lab/docker-compose.yml logs --no-color
      - name: Tear down stacks
        if: always()
        run: |
          docker compose --project-name spectrascope -f docker-compose.yml -f docker-compose.local-real.yml down -v
          docker compose --project-name spectrascope-lab -f lab/docker-compose.yml down -v
