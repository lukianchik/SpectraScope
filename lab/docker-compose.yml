services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: spectrascope-lab-proxy
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:8092:8092"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice-shop
      - mock-admin-panel
      - mock-legacy-service
      - directory-listing
      # - dvwa
      # - webgoat
    networks:
      lab:
        aliases:
          - admin.lab.local
          - legacy.lab.local
          - files.lab.local
          - juice.lab.local
          - dvwa.lab.local
          - webgoat.lab.local

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: spectrascope-lab-juice-shop
    expose:
      - "3000"
    networks:
      - lab

  mock-admin-panel:
    build:
      context: ./mock-services/admin-panel
    container_name: spectrascope-lab-admin-panel
    expose:
      - "5000"
    networks:
      - lab

  mock-legacy-service:
    build:
      context: ./mock-services/legacy-service
    container_name: spectrascope-lab-legacy-service
    expose:
      - "5000"
    networks:
      - lab

  directory-listing:
    build:
      context: ./mock-services/directory-listing
    container_name: spectrascope-lab-directory-listing
    expose:
      - "80"
    networks:
      - lab

  # Optional: DVWA can be enabled for manual local testing.
  # Keep it disabled by default because images and setup differ by environment.
  #
  # dvwa:
  #   image: vulnerables/web-dvwa:latest
  #   expose:
  #     - "80"
  #   networks:
  #     - lab

  # Optional: WebGoat is useful but comparatively heavy.
  #
  # webgoat:
  #   image: webgoat/webgoat:latest
  #   expose:
  #     - "8080"
  #   networks:
  #     - lab

networks:
  lab:
    driver: bridge
