events {}

http {
    server_tokens off;

    upstream juice_shop {
        server juice-shop:3000;
    }

    upstream mock_admin_panel {
        server mock-admin-panel:5000;
    }

    upstream mock_legacy_service {
        server mock-legacy-service:5000;
    }

    upstream directory_listing {
        server directory-listing:80;
    }

    # Optional DVWA/WebGoat routes are disabled by default because the services
    # are commented out in docker-compose.yml. Uncomment together with services.

    server {
        listen 80;
        listen 8088;
        server_name juice.lab.local;

        location / {
            proxy_pass http://juice_shop;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 80;
        listen 8088;
        server_name admin.lab.local;

        location / {
            proxy_pass http://mock_admin_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 80;
        listen 8088;
        server_name legacy.lab.local;

        location / {
            proxy_pass http://mock_legacy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 80;
        listen 8088;
        server_name files.lab.local;

        location / {
            proxy_pass http://directory_listing;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # upstream dvwa {
    #     server dvwa:80;
    # }
    #
    # server {
    #     listen 80;
    #     server_name dvwa.lab.local;
    #
    #     location / {
    #         proxy_pass http://dvwa;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto http;
    #     }
    # }
    #
    # upstream webgoat {
    #     server webgoat:8080;
    # }
    #
    # server {
    #     listen 80;
    #     server_name webgoat.lab.local;
    #
    #     location / {
    #         proxy_pass http://webgoat;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto http;
    #     }
    # }

    server {
        listen 80 default_server;
        listen 8088 default_server;
        server_name _;
        return 404 "Unknown SpectraScope lab host\n";
    }

    server {
        listen 8089;
        server_name localhost;

        location / {
            proxy_pass http://mock_admin_panel;
            proxy_set_header Host admin.lab.local;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 8090;
        server_name localhost;

        location / {
            proxy_pass http://mock_legacy_service;
            proxy_set_header Host legacy.lab.local;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 8091;
        server_name localhost;

        location / {
            proxy_pass http://directory_listing;
            proxy_set_header Host files.lab.local;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 8092;
        server_name localhost;

        location / {
            proxy_pass http://juice_shop;
            proxy_set_header Host juice.lab.local;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
